# Streamlit theme for the Load Log web app.
# Navy terminal look mirroring the readablecode portfolio site: monospace type,
# green prompt accent, amber highlights. Charts and custom CSS in
# src/web/app.py use the same tokens (see the THEME constants there) so the
# whole page reads as one system.

[theme]
base = "dark"
primaryColor = "#2ea043"
backgroundColor = "#0d1420"
secondaryBackgroundColor = "#121b2a"
textColor = "#dbe4f0"
linkColor = "#56d364"
borderColor = "#243247"
dataframeBorderColor = "#243247"
dataframeHeaderBackgroundColor = "#182333"
baseRadius = "0.5rem"
font = "monospace"

[browser]
gatherUsageStats = false
