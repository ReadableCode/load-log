# Alembic configuration for load-log.
#
# The database URL is NOT set here. env.py builds it at runtime from the
# POSTGRES_* environment variables (the same ones db.py / config.py read), so
# secrets never live in this file and the same image works in every environment.

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template used to generate migration file names. Prefixing with a zero-padded
# sequence (we name them 0001, 0002, ...) keeps versions/ readable.
# file_template = %%(rev)s_%%(slug)s

# Timezone for the create-date stamp in generated migrations.
# timezone =

prepend_sys_path = .

# Version path separator. Default (os) is fine.
version_path_separator = os

[post_write_hooks]
# No automatic post-write hooks (black/isort run via the repo's own tooling).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
