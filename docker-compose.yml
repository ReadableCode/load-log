# Portable single-container stack: just the Streamlit web app, pointed at the
# shared PostgREST and Postgres (PostgREST defaults to the tinkernet deployment,
# override via .env). Use docker-compose.dev.yml instead if you want a fully
# self-contained local stack (its own Postgres + PostgREST).
#
# The FastAPI `api` service was removed along with the old direct-Postgres data
# layer; the app reaches data only through PostgREST now.
services:
  web:
    build:
      # Repo root: the Dockerfile needs deploy/*.sql as well as backend/.
      context: .
      dockerfile: backend/Dockerfile
    container_name: load_log_web
    command:
      - uv
      - run
      - streamlit
      - run
      - src/web/app.py
      - --server.port=8505
      - --server.address=0.0.0.0
      - --server.headless=true
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Data goes through PostgREST.
      POSTGREST_URL: ${POSTGREST_URL:-https://pgrest.tinkernet.me}
      # PostgREST's secret: login (the postgrest-auth library, in-process)
      # signs the session JWT with it.
      POSTGREST_JWT_SECRET: ${POSTGREST_JWT_SECRET}
      # Superuser connection for login (it reads load_log.users) and the startup
      # schema bootstrap (src/bootstrap.py). Application data still goes only
      # through PostgREST.
      POSTGRES_URL: ${POSTGRES_URL}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB:-apps}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8505:8505"
    restart: unless-stopped
