# Load Log Streamlit web UI's service definition for the elitedesk stack.
# Pulled into Docker/docker_compose_projects.yaml via `include:`; the include
# entry sets project_directory to this repo's root, so `context: .` resolves to
# the repo root and the ${VARS} below interpolate from this
# repo's .env (a symlink to personal_credentials/personal.env). depends_on
# resolves in the merged compose model: postgres/postgrest stay in the
# central file.
services:
  load-log-streamlit:
    image: load_log_streamlit_image
    build:
      # Repo root, so the Dockerfile can COPY deploy/*.sql (the schema files
      # src/bootstrap.py applies at startup) alongside backend/.
      context: .
      dockerfile: backend/Dockerfile
    container_name: load_log_streamlit
    command:
      - uv
      - run
      - streamlit
      - run
      - src/web/app.py
      - --server.port=8505
      - --server.address=0.0.0.0
      - --server.headless=true
    environment:
      # Application data moves ONLY through PostgREST.
      POSTGREST_URL: http://postgrest:3000
      # PostgREST's secret: login (the postgrest-auth library, in-process)
      # signs the session JWT with it.
      POSTGREST_JWT_SECRET: ${POSTGREST_JWT_SECRET}
      # POSTGRES_* is the app's superuser connection for login (it reads
      # load_log.users, which PostgREST cannot reach) and for the schema
      # bootstrap at startup (src/bootstrap.py). Application data still moves
      # only over PostgREST.
      POSTGRES_URL: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: apps
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
      - postgrest
    ports:
      - "8505:8505"
    restart: unless-stopped
